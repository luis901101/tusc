name: tusc
description: A tus client for dart to allow resumable uploads using the tus protocol (https://tus.io/).
version: 4.0.0
homepage: https://github.com/luis901101/tusc

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  http: '>=0.13.0 <2.0.0'
  cross_file: ^0.3.5+4
  hive_ce: ^2.19.3
  path: ^1.9.1
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
